  <style>
    :root{--g:#5C7A5A;--gd:#3A5A38;--sand:#F5EFE6;--sand2:#EDE4D8;--txt:#1A1A1A;--tm:#4A4A4A;--w:#fff;--goldl:#E8C060}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans JP',sans-serif;background:linear-gradient(160deg,var(--sand) 0%,#fff 100%);color:var(--txt);line-height:1.9}
    a{text-decoration:none;color:inherit}
    .wrap{max-width:860px;margin:0 auto;padding:92px 5% 84px}
    .back{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--tm);margin-bottom:18px}
    .back:hover{color:var(--g)}
    .head{display:grid;grid-template-columns:minmax(220px,260px) 1fr;gap:26px;align-items:start;margin-top:10px}
    .photo{border-radius:22px;overflow:hidden;border:1px solid rgba(0,0,0,.06);background:linear-gradient(165deg,rgba(58,90,56,.08) 0%,rgba(224,213,200,.35) 55%,rgba(255,255,255,.65) 100%);box-shadow:0 12px 40px rgba(0,0,0,.10)}
    .photo img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
    .name{font-family:'Noto Serif JP',serif;font-size:22px;font-weight:900;color:var(--gd);line-height:1.35}
    .role{font-size:12px;font-weight:800;letter-spacing:.12em;color:rgba(74,74,74,.72);margin-top:6px}
    h1{font-family:'Noto Serif JP',serif;font-size:clamp(22px,3.2vw,32px);font-weight:900;color:var(--gd);line-height:1.45;margin-top:14px}
    .lead{margin-top:12px;color:var(--tm);font-size:14px;line-height:2.05;max-width:56ch}
    .paper{margin-top:26px;background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.06);border-radius:18px;padding:22px 20px}
    .paper p{font-family:'Noto Serif JP',serif;font-size:15px;line-height:2.15;color:rgba(74,74,74,.94);margin:0}
    .paper p + p{margin-top:14px}
    .note{margin-top:16px;font-size:12px;color:rgba(74,74,74,.64);line-height:1.85}
    @media(max-width:900px){.head{grid-template-columns:1fr;gap:18px}.photo{max-width:320px}}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/#message">← 挨拶に戻る</a>

    <div class="head">
      <div class="photo" aria-label="大久保 俊輝（写真）">
        <img src="./lp-assets/okubo-portrait.jpg?v=20260508a" alt="大久保 俊輝" loading="lazy" decoding="async" onerror="this.style.display='none'">
      </div>
      <div>
        <div class="name">大久保 俊輝</div>
        <div class="role">代表</div>
        <h1>子どもと家庭に、静かな羅針盤を。</h1>
        <p class="lead">※写真・メッセージ本文は、到着次第こちらを差し替えます。いまはページ遷移と雰囲気の確認用の仮コンテンツです。</p>
      </div>
    </div>

    <div class="paper" aria-label="代表メッセージ（仮）">
      <p>子どもが苦しんでいるとき、いちばんつらいのは「どうすればいいか分からない」時間かもしれません。</p>
      <p>私たちは、正しいことを言うためではなく、ご家庭の現実が少しずつ動き出すように、必要な順番と関わり方を一緒に整えます。</p>
      <p>変化は派手ではなく、小さく始まります。その小さな一歩を、確かな一歩にしていく。そこに責任を持ちたいと思っています。</p>
      <div class="note">（仮）元校長／元大学教授／教育相談三万件／心理カウンセラー指導員</div>
    </div>
  </div>
</body>
