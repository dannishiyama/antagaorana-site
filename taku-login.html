  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --g:#5C7A5A; --gd:#3A5A38; --sand:#F5EFE6; --rose:#C4856A; --gold:#D4A843;
      --txt:#1A1A1A; --tm:#4A4A4A; --w:#fff;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans JP',sans-serif;color:var(--txt);background:linear-gradient(160deg,var(--sand) 0%,#fff 100%);line-height:1.85}
    a{text-decoration:none;color:inherit}
    .wrap{max-width:860px;margin:0 auto;padding:96px 5% 80px}
    .card{background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.06);border-radius:22px;box-shadow:0 16px 48px rgba(0,0,0,.10);overflow:hidden}
    .hd{padding:24px 24px 18px;background:linear-gradient(135deg,rgba(92,122,90,.12) 0%,rgba(196,133,106,.10) 100%)}
    .tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;padding:5px 12px;border-radius:999px;background:rgba(92,122,90,.12);color:var(--g)}
    h1{font-family:'Noto Serif JP',serif;font-size:clamp(22px,4vw,34px);font-weight:900;color:var(--gd);line-height:1.45;margin-top:10px}
    .lead{margin-top:10px;color:var(--tm);font-size:14px;line-height:2}
    .bd{padding:22px 24px 26px}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
    .step{border-radius:16px;background:#fff;border:1px solid rgba(0,0,0,.06);padding:14px}
    .step b{display:block;font-size:11px;letter-spacing:.12em;color:rgba(58,90,56,.82)}
    .step span{display:block;margin-top:6px;font-size:13px;color:var(--tm);line-height:1.85}
    .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:999px;font-weight:900;letter-spacing:.06em}
    .btn.prim{background:linear-gradient(135deg,var(--gold),var(--rose));color:var(--w);box-shadow:0 10px 28px rgba(212,168,67,.22)}
    .btn.ghost{border:2px solid rgba(42,74,42,.18);color:var(--gd);background:#fff}
    .note{margin-top:16px;font-size:12px;color:rgba(0,0,0,.55);line-height:1.9}
    .back{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--tm);margin-bottom:18px}
    .back:hover{color:var(--g)}
    @media(max-width:760px){
      .steps{grid-template-columns:1fr}
    }
  </style>
</head>
