<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>お申し込みありがとうございます｜HAKU Community</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lp-assets/haku-design.css?v=20261008a">
<link rel="stylesheet" href="/lp-assets/haku-entry.css?v=20261008a">
</head>
<body class="h-base">
<div class="top">HAKU COMMUNITY</div>
<main>
  <div class="narrow">
    <h1>お申し込み、<br>ありがとうございます。</h1>
    <p>HAKU Communityへのお申し込み手続きが完了しました。これからのご案内は、順次お届けします。</p>

    <ol class="steps">
      <li><span class="n">01</span><span>ご参加のご案内<small>LINEでのご案内方法は、現在準備中です。</small></span></li>
      <li><span class="n">02</span><span>最初の「今週の問い」<small>HAKU NOTEのお届け方法は、現在準備中です。</small></span></li>
    </ol>

    <a href="/haku-community/login/" class="btn" id="backBtn">HAKU Communityに戻る</a>
  </div>
</main>
<script>
// 決済完了直後の遷移先を、実際の認証・Membership状態に合わせて振り分ける。
//   ログイン済みセッション + HAKU Membership active → 会員ページへ直接
//   それ以外（多くの場合、登録時点ではまだログインしていないため） → ログインへ
// アクセス制御自体はここでは判定しない（会員ページ側 api/haku-home.js の
// セッション＋Membershipチェックが引き続き最終的な関門）。
(function () {
  var btn = document.getElementById('backBtn');
  fetch('/api/community-auth?action=me')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data && data.ok && data.memberships && data.memberships.haku) {
        btn.href = '/haku-community/home/';
      }
    })
    .catch(function () { /* 取得失敗時はログインへのデフォルトのまま */ });
})();
</script>
</body>
</html>
