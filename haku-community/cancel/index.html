<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>お申し込みは完了していません｜HAKU Community</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lp-assets/haku-design.css?v=20261008a">
<link rel="stylesheet" href="/lp-assets/haku-entry.css?v=20261008a">
</head>
<body class="h-base">
<div class="top">HAKU COMMUNITY</div>
<main>
  <div class="narrow">
    <h1>お申し込みは、<br>まだ完了していません。</h1>
    <p>決済の手続きが途中で中断されました。料金は発生していません。急ぐ必要はありません。あらためて考えたうえで、いつでもお申し込みいただけます。</p>
    <div class="ctas">
      <a href="/haku-community/#h-apply" class="btn btn-solid" id="back-apply">申し込み画面に戻る</a>
      <a href="/haku-community/" class="btn">HAKU Communityを見る</a>
    </div>
  </div>
</main>
<script>
// 選んでいた区分（teacher / professional のみ許可）を申込み画面に引き継ぐ
(function(){
  try {
    var seg = new URLSearchParams(location.search).get('for');
    if(seg === 'teacher' || seg === 'professional'){
      document.getElementById('back-apply').href = '/haku-community/?for=' + seg + '#h-apply';
    }
  } catch(e) {}
})();
</script>
</body>
</html>
