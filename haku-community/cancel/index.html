<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>お申し込みは完了していません｜HAKU Community</title>
<style>
:root{
  color-scheme:light;
  --green:#466246;--green-dk:#33472f;--cream:#f7f3ec;--paper:#fffdf8;--ink:#2f3a2f;--mid:#5c5a4e;--faint:#6f6c5b;
  --terra:#8c692c;--gold:#d8b15a;--accent-ink:#8a5a1f;--line:#cdbfa0;--line-soft:#ddd3bd;
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","HiraMinProN-W3","游明朝",serif;
  --sans:"Yu Gothic","YuGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.9;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--green-dk);color:#fff;padding:16px 8%;font-family:var(--serif);font-size:13px;letter-spacing:.2em}
main{flex:1;display:flex;align-items:center;padding:80px 0}
.narrow{max-width:640px;margin:0 auto;padding:0 8%;width:100%}
.label{font-size:11px;letter-spacing:.24em;color:var(--faint);margin-bottom:26px}
h1{font-family:var(--serif);font-weight:500;letter-spacing:.04em;font-size:28px;line-height:1.7;color:var(--green-dk);margin-bottom:22px}
p{color:var(--mid);max-width:34em}
.ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:40px}
.btn{display:inline-block;padding:14px 30px;font-size:14px;letter-spacing:.08em;border:1px solid var(--green-dk);color:var(--green-dk);background:none;text-decoration:none;transition:transform .18s ease}
.btn-solid{background:var(--terra);border-color:var(--terra);color:#fff}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:900px){main{padding:56px 0}.narrow{padding:0 7%}h1{font-size:22px}.ctas .btn{width:100%;text-align:center}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="top">HAKU COMMUNITY</div>
<main>
  <div class="narrow">
    <div class="label">NOT COMPLETED</div>
    <h1>お申し込みは、<br>まだ完了していません。</h1>
    <p>決済の手続きが途中で中断されました。料金は発生していません。急ぐ必要はありません。あらためて考えたうえで、いつでもお申し込みいただけます。</p>
    <div class="ctas">
      <a href="/haku-community/#h-apply" class="btn btn-solid" id="back-apply">申し込み画面に戻る</a>
      <a href="/haku-community/" class="btn">HAKU Communityを見る</a>
    </div>
  </div>
</main>
<script>
// 選んでいた区分（teacher / professional のみ許可）を申込み画面に引き継ぐ
(function(){
  try {
    var seg = new URLSearchParams(location.search).get('for');
    if(seg === 'teacher' || seg === 'professional'){
      document.getElementById('back-apply').href = '/haku-community/?for=' + seg + '#h-apply';
    }
  } catch(e) {}
})();
</script>
</body>
</html>
