<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>お申し込みありがとうございます｜HAKU Community</title>
<style>
:root{
  color-scheme:light;
  --green:#466246;--green-dk:#33472f;--cream:#f7f3ec;--paper:#fffdf8;--ink:#2f3a2f;--mid:#5c5a4e;--faint:#6f6c5b;
  --terra:#8c692c;--gold:#d8b15a;--accent-ink:#8a5a1f;--line:#cdbfa0;--line-soft:#ddd3bd;
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","HiraMinProN-W3","游明朝",serif;
  --sans:"Yu Gothic","YuGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.9;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--green-dk);color:#fff;padding:16px 8%;font-family:var(--serif);font-size:13px;letter-spacing:.2em}
main{flex:1;display:flex;align-items:center;padding:80px 0}
.narrow{max-width:640px;margin:0 auto;padding:0 8%;width:100%}
.label{font-size:11px;letter-spacing:.24em;color:var(--faint);margin-bottom:26px}
.rule{display:block;width:40px;height:1px;background:var(--gold);margin-bottom:28px}
h1{font-family:var(--serif);font-weight:500;letter-spacing:.04em;font-size:30px;line-height:1.7;color:var(--green-dk);margin-bottom:22px}
p{color:var(--mid);max-width:34em}
.steps{list-style:none;margin:40px 0;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line-soft);font-size:14px;color:var(--ink)}
.steps .n{font-family:var(--serif);font-size:13px;color:var(--accent-ink);letter-spacing:.1em}
.steps small{display:block;font-size:12.5px;color:var(--faint)}
.test{font-size:12.5px;border:1px dashed var(--line);background:var(--paper);padding:12px 16px;margin-bottom:36px}
.btn{display:inline-block;padding:14px 30px;font-size:14px;letter-spacing:.08em;border:1px solid var(--terra);background:var(--terra);color:#fff;text-decoration:none;transition:transform .18s ease}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:900px){main{padding:56px 0}.narrow{padding:0 7%}h1{font-size:23px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="top">HAKU COMMUNITY</div>
<main>
  <div class="narrow">
    <div class="label">THANK YOU</div>
    <span class="rule" aria-hidden="true"></span>
    <h1>お申し込み、<br>ありがとうございます。</h1>
    <p>HAKU Communityへのお申し込み手続きが完了しました。これからのご案内は、順次お届けします。</p>

    <ol class="steps">
      <li><span class="n">01</span><span>ご参加のご案内<small>LINEでのご案内方法は、現在準備中です。</small></span></li>
      <li><span class="n">02</span><span>最初の「今週の問い」<small>HAKU NOTEのお届け方法は、現在準備中です。</small></span></li>
    </ol>

    <p class="test">※ これはテスト環境です。実際の請求は発生していません。</p>
    <a href="./haku-community-login.html" class="btn" id="backBtn">HAKU Communityに戻る</a>
  </div>
</main>
<script>
// 決済完了直後の遷移先を、実際の認証・Membership状態に合わせて振り分ける。
//   ログイン済みセッション + HAKU Membership active → 会員ページへ直接
//   それ以外（多くの場合、登録時点ではまだログインしていないため） → ログインへ
// アクセス制御自体はここでは判定しない（会員ページ側 api/haku-home.js の
// セッション＋Membershipチェックが引き続き最終的な関門）。
(function () {
  var btn = document.getElementById('backBtn');
  fetch('/api/community-auth?action=me')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data && data.ok && data.memberships && data.memberships.haku) {
        btn.href = './haku-community-home.html';
      }
    })
    .catch(function () { /* 取得失敗時はログインへのデフォルトのまま */ });
})();
</script>
</body>
</html>
