  <style>

    p{font-size:14px;color:var(--tm);margin:16px 0}
    .note{font-size:13px;color:#666;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.06);border-radius:14px;padding:16px 18px}
