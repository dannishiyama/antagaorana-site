<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>パスワード設定｜あんたがおらな</title>
<link rel="icon" type="image/png" href="./lp-assets/logo-hero.png?v=20260501a">
<link rel="stylesheet" href="./lp-assets/community-tokens.css">
<style>
:root{color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-green-dark);color:var(--color-text);font-family:var(--font-sans);font-size:15px;line-height:1.9;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;color:#fff}
.card{width:100%;max-width:400px;text-align:center}
.mark{font-family:var(--font-serif);font-size:20px;letter-spacing:.1em;margin-bottom:8px}
.sub{font-size:12.5px;color:rgba(255,255,255,.6);margin-bottom:36px}
.field{text-align:left;margin-bottom:20px}
.field label{display:block;font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.62);margin-bottom:8px}
.field input{width:100%;min-height:44px;padding:12px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);color:#fff;outline:none;font-size:14px}
.go{width:100%;min-height:48px;padding:14px;background:#8c692c;border:1px solid #8c692c;color:#fff;font-size:14px;letter-spacing:.14em;cursor:pointer;font-family:inherit}
.go[disabled]{opacity:.6;cursor:progress}
.err{font-size:12.5px;color:#f0c2a8;margin-top:14px;min-height:18px;opacity:0}
.err.show{opacity:1}
.ok{font-size:13.5px;color:#cfe0c8;line-height:1.9}
</style>
</head>
<body>
<div class="stage">
  <div class="card" id="card">
    <div class="mark">パスワードの設定</div>
    <p class="sub">ログインに使うパスワードを設定してください</p>

    <form id="f" novalidate>
      <div class="field">
        <label for="password">パスワード</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="8文字以上">
      </div>
      <div class="field">
        <label for="password2">パスワード（確認）</label>
        <input id="password2" type="password" autocomplete="new-password" placeholder="8文字以上">
      </div>
      <button class="go" type="submit" id="go">設定してログインする</button>
      <p class="err" id="err" role="alert" aria-live="polite"></p>
    </form>
    <p class="ok" id="ok" hidden>パスワードを設定しました。まもなく会員ページへ移動します…</p>
  </div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  var community = params.get('community') || '';
  var form = document.getElementById('f');
  var err = document.getElementById('err');
  var ok = document.getElementById('ok');
  var go = document.getElementById('go');

  function showError(msg){ err.textContent = msg; err.classList.add('show'); }

  if (!token) { showError('リンクが不正です。メール記載のリンクから再度お試しください。'); go.disabled = true; }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var pw = document.getElementById('password').value || '';
    var pw2 = document.getElementById('password2').value || '';
    if (pw.length < 8) { showError('パスワードは8文字以上でご設定ください。'); return; }
    if (pw !== pw2) { showError('パスワードが一致しません。'); return; }
    err.textContent = ''; err.classList.remove('show');
    go.disabled = true; go.textContent = '設定しています…';

    fetch('/api/community-auth?action=set-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, password: pw, password2: pw2 }),
    }).then(function(r){ return r.json().then(function(data){ return { status: r.status, data: data }; }); })
      .then(function(res){
        if (res.status !== 200) { showError(res.data.error || '設定に失敗しました。'); go.disabled = false; go.textContent = '設定してログインする'; return; }
        form.hidden = true;
        ok.hidden = false;
        var dest = res.data.community === 'haku' ? './haku-community-home.html' : './tomoshibi-post.html';
        setTimeout(function(){ location.href = dest; }, 1200);
      })
      .catch(function(){ showError('通信に失敗しました。時間をおいて再度お試しください。'); go.disabled = false; go.textContent = '設定してログインする'; });
  });
})();
</script>
</body>
</html>
