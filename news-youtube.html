  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--g:#5C7A5A;--gd:#3A5A38;--sand:#F5EFE6;--txt:#1A1A1A;--tm:#4A4A4A;--w:#fff;--goldl:#E8C060}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans JP',sans-serif;background:linear-gradient(160deg,var(--sand) 0%,#fff 100%);color:var(--txt);line-height:1.9}
    a{text-decoration:none;color:inherit}
    .wrap{max-width:860px;margin:0 auto;padding:92px 5% 84px}
    .back{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--tm);margin-bottom:18px}
    .back:hover{color:var(--g)}
    h1{font-family:'Noto Serif JP',serif;font-size:clamp(20px,3.1vw,30px);font-weight:900;color:var(--gd);line-height:1.45;margin-bottom:10px}
    .meta{font-size:12px;color:#777;margin-bottom:18px}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
    .tag{display:inline-flex;align-items:center;font-size:11px;font-weight:900;letter-spacing:.12em;color:rgba(58,90,56,.92);background:rgba(92,122,90,.11);border:1px solid rgba(92,122,90,.18);padding:5px 10px;border-radius:999px}

    .gallery{margin:18px 0 18px}
    .g-shell{position:relative;border-radius:20px;overflow:hidden;border:1px solid rgba(0,0,0,.06);box-shadow:0 14px 40px rgba(0,0,0,.10);background:#fff}
    .g-track{display:flex;overflow:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .g-track::-webkit-scrollbar{display:none}
    .g-slide{flex:0 0 100%;scroll-snap-align:center;position:relative;background:#fff}
    .g-slide img{width:100%;height:clamp(240px,44vw,520px);display:block;object-fit:cover;object-position:50% 32%;background:#fff}
    .g-cap{position:absolute;left:12px;bottom:12px;font-size:12px;color:rgba(26,26,26,.78);background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.06);border-radius:999px;padding:6px 10px;backdrop-filter:blur(6px)}
    .g-btn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:999px;border:1px solid rgba(0,0,0,.10);background:rgba(255,255,255,.86);color:rgba(26,26,26,.86);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .18s ease,opacity .18s ease}
    .g-btn:hover{transform:translateY(-50%) scale(1.02)}
    .g-btn.prev{left:10px}
    .g-btn.next{right:10px}
    .g-dots{display:flex;justify-content:center;gap:7px;margin-top:10px}
    .g-dot{width:6px;height:6px;border-radius:50%;background:rgba(58,90,56,.18)}
    .g-dot.is-on{background:rgba(58,90,56,.55)}

    p{font-size:14px;color:var(--tm);margin:16px 0;line-height:2}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:999px;font-weight:900;letter-spacing:.06em;background:linear-gradient(135deg,var(--goldl),#C4856A);color:#fff}
    .btn:hover{opacity:.95}
    .cta{margin-top:18px}
    @media(max-width:560px){
      .wrap{padding:78px 5% 74px}
      .g-slide img{height:clamp(220px,62vw,420px)}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="./news.html">← お知らせ一覧に戻る</a>
    <div class="tags">
      <span class="tag">VIDEO</span>
    </div>
    <h1>YouTube動画を公開しました</h1>
    <div class="meta">2026</div>

    <div class="gallery" aria-label="動画・活動の写真ギャラリー">
      <div class="g-shell" data-gallery>
        <div class="g-track">
          <figure class="g-slide">
            <img src="./lp-assets/news-src-02.png?v=20260501" alt="YouTube動画のサムネイル">
            <figcaption class="g-cap">YouTube</figcaption>
          </figure>
          <figure class="g-slide">
            <img src="./lp-assets/news-02.png?v=20260501" alt="YouTube動画の一覧サムネイル">
            <figcaption class="g-cap">サムネイル</figcaption>
          </figure>
        </div>
        <button class="g-btn prev" type="button" aria-label="前の写真へ">←</button>
        <button class="g-btn next" type="button" aria-label="次の写真へ">→</button>
      </div>
      <div class="g-dots" aria-hidden="true">
        <span class="g-dot is-on"></span><span class="g-dot"></span>
      </div>
    </div>

    <p>活動の様子や想いを、動画でもお届けします。</p>
    <div class="cta">
      <a class="btn" href="https://youtu.be/Q6o7dEmq3Ds?si=Vgf-OPfZBmHyB3Z6" target="_blank" rel="noopener noreferrer">YouTubeで見る →</a>
    </div>
  </div>

  <script>
    (function(){
      const shell = document.querySelector('[data-gallery]');
      if(!shell) return;
      const track = shell.querySelector('.g-track');
      const slides = Array.from(shell.querySelectorAll('.g-slide'));
      const dots = Array.from(document.querySelectorAll('.g-dot'));
      const btnPrev = shell.querySelector('.g-btn.prev');
      const btnNext = shell.querySelector('.g-btn.next');

      function indexFromScroll(){
        const w = track.clientWidth || 1;
        return Math.round(track.scrollLeft / w);
      }
      function setDot(i){
        dots.forEach((d,idx)=>d.classList.toggle('is-on', idx===i));
      }
      function go(i){
        const w = track.clientWidth || 1;
        const clamped = Math.max(0, Math.min(slides.length-1, i));
        track.scrollTo({left: w*clamped, behavior: 'smooth'});
        setDot(clamped);
      }
      btnPrev && btnPrev.addEventListener('click', ()=>go(indexFromScroll()-1));
      btnNext && btnNext.addEventListener('click', ()=>go(indexFromScroll()+1));
      track.addEventListener('scroll', ()=>setDot(indexFromScroll()), {passive:true});
    })();
  </script>
</body>
