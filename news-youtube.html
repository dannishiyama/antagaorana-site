<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube動画の紹介 | お知らせ | あんたがおらな</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--g:#5C7A5A;--gd:#3A5A38;--sand:#F5EFE6;--txt:#1A1A1A;--tm:#4A4A4A;--w:#fff;--goldl:#E8C060}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans JP',sans-serif;background:linear-gradient(160deg,var(--sand) 0%,#fff 100%);color:var(--txt);line-height:1.9}
    a{text-decoration:none;color:inherit}
    .wrap{max-width:860px;margin:0 auto;padding:92px 5% 84px}
    .back{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--tm);margin-bottom:18px}
    .back:hover{color:var(--g)}
    h1{font-family:'Noto Serif JP',serif;font-size:clamp(20px,3.1vw,30px);font-weight:900;color:var(--gd);line-height:1.45;margin-bottom:10px}
    .meta{font-size:12px;color:#777;margin-bottom:18px}
    .hero{border-radius:20px;overflow:hidden;border:1px solid rgba(0,0,0,.06);box-shadow:0 14px 40px rgba(0,0,0,.10);background:#fff}
    .hero img{width:100%;height:auto;display:block}
    p{font-size:14px;color:var(--tm);margin:16px 0}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:999px;font-weight:900;letter-spacing:.06em;background:linear-gradient(135deg,var(--goldl),#C4856A);color:#fff}
    .btn:hover{opacity:.95}
    .cta{margin-top:18px}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/wp-content/themes/education-zone/news.html">← お知らせ一覧に戻る</a>
    <h1>YouTube動画を公開しました</h1>
    <div class="meta">2026</div>

    <div class="hero">
      <img src="/wp-content/themes/education-zone/lp-assets/news-src-02.png?v=20260501" alt="YouTube動画のサムネイル">
    </div>

    <p>活動の様子や想いを、動画でもお届けします。</p>
    <div class="cta">
      <a class="btn" href="https://youtu.be/Q6o7dEmq3Ds?si=Vgf-OPfZBmHyB3Z6" target="_blank" rel="noopener noreferrer">YouTubeで見る →</a>
    </div>
  </div>
</body>
</html>
