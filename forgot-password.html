<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>パスワードをお忘れの方｜あんたがおらな</title>
<link rel="icon" type="image/png" href="/lp-assets/logo-hero.png?v=20260501a">
<link rel="stylesheet" href="/lp-assets/community-tokens.css">
<style>
:root{color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-green-dark);color:var(--color-text);font-family:var(--font-sans);font-size:15px;line-height:1.9;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{padding:20px 8%}
.top a{color:rgba(255,255,255,.7);font-size:12.5px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 24px 60px;color:#fff}
.card{width:100%;max-width:400px;text-align:center}
.mark{font-family:var(--font-serif);font-size:20px;letter-spacing:.1em;margin-bottom:8px}
.sub{font-size:12.5px;color:rgba(255,255,255,.6);margin-bottom:36px;line-height:1.9}
.field{text-align:left;margin-bottom:20px}
.field label{display:block;font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.62);margin-bottom:8px}
.field select,.field input{width:100%;min-height:44px;padding:12px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);color:#fff;outline:none;font-size:14px;font-family:inherit}
.field select option{color:#000}
.go{width:100%;min-height:48px;padding:14px;background:#8c692c;border:1px solid #8c692c;color:#fff;font-size:14px;letter-spacing:.14em;cursor:pointer;font-family:inherit}
.go[disabled]{opacity:.6;cursor:progress}
.msg{font-size:13.5px;color:#cfe0c8;margin-top:16px;line-height:1.9}
.back{margin-top:36px;font-size:12.5px;color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<div class="top"><a href="/haku-community/login/">← ログインページへ</a></div>
<div class="stage">
  <div class="card">
    <div class="mark">パスワードをお忘れの方</div>
    <p class="sub">ご登録のメールアドレス宛に、パスワード再設定用のリンクをお送りします。</p>

    <form id="f" novalidate>
      <div class="field">
        <label for="community">コミュニティ</label>
        <select id="community">
          <option value="haku">HAKU Community</option>
          <option value="tomoshibi">教育者のサロン 灯</option>
        </select>
      </div>
      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
      </div>
      <button class="go" type="submit" id="go">再設定メールを送る</button>
    </form>
    <p class="msg" id="msg" hidden></p>

    <p class="back">
      <a href="/haku-community/login/">HAKUログインへ</a> ・ <a href="/tomoshibi-login">灯ログインへ</a>
    </p>
  </div>
</div>

<script>
(function(){
  var form = document.getElementById('f');
  var go = document.getElementById('go');
  var msg = document.getElementById('msg');
  var presetCommunity = new URLSearchParams(location.search).get('community');
  if (presetCommunity === 'haku' || presetCommunity === 'tomoshibi') {
    document.getElementById('community').value = presetCommunity;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var community = document.getElementById('community').value;
    var email = document.getElementById('email').value.trim();
    go.disabled = true; go.textContent = '送信しています…';
    fetch('/api/community-auth?action=request-password-reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ community: community, email: email }),
    }).then(function(r){ return r.json(); })
      .then(function(data){
        form.hidden = true;
        msg.hidden = false;
        msg.textContent = data.message || 'ご入力のメールアドレスが登録されている場合、パスワード再設定用のメールをお送りしました。';
      })
      .catch(function(){
        go.disabled = false; go.textContent = '再設定メールを送る';
        msg.hidden = false;
        msg.style.color = '#f0c2a8';
        msg.textContent = '通信に失敗しました。時間をおいて再度お試しください。';
      });
  });
})();
</script>
</body>
</html>
