    :root{--g:#5C7A5A;--gd:#3A5A38;--sand:#F5EFE6;--txt:#1A1A1A;--tm:#4A4A4A;--w:#fff}
    *{margin:0;padding:0;box-sizing:border-box}

    .tag{display:inline-flex;align-items:center;font-size:11px;font-weight:900;letter-spacing:.12em;color:rgba(58,90,56,.92);background:rgba(92,122,90,.11);border:1px solid rgba(92,122,90,.18);padding:5px 10px;border-radius:999px}

    /* gallery */
    .gallery{margin:18px 0 18px}
    .g-shell{position:relative;border-radius:20px;overflow:hidden;border:1px solid rgba(0,0,0,.06);box-shadow:0 14px 40px rgba(0,0,0,.10);background:#fff}
    .g-track{
      display:flex;
      overflow:auto;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .g-track::-webkit-scrollbar{display:none}
    .g-slide{flex:0 0 100%;scroll-snap-align:center;position:relative;background:#fff}
    .g-slide img{width:100%;height:clamp(240px,44vw,520px);display:block;object-fit:cover;object-position:50% 24%;background:#fff}
    .g-slide.fit-contain img{object-fit:contain;object-position:50% 50%}
    .g-cap{position:absolute;left:12px;bottom:12px;font-size:12px;color:rgba(26,26,26,.78);background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.06);border-radius:999px;padding:6px 10px;backdrop-filter:blur(6px)}
    .g-btn{
      position:absolute;top:50%;transform:translateY(-50%);
      width:40px;height:40px;border-radius:999px;border:1px solid rgba(0,0,0,.10);
      background:rgba(255,255,255,.86);color:rgba(26,26,26,.86);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;user-select:none;
      transition:transform .18s ease,opacity .18s ease;
    }
    .g-btn:hover{transform:translateY(-50%) scale(1.02)}
    .g-btn.prev{left:10px}
    .g-btn.next{right:10px}
    .g-dots{display:flex;justify-content:center;gap:7px;margin-top:10px}
    .g-dot{width:6px;height:6px;border-radius:50%;background:rgba(58,90,56,.18)}
    .g-dot.is-on{background:rgba(58,90,56,.55)}

    p{font-size:14px;color:var(--tm);margin:16px 0;line-height:2}
    .note{font-size:13px;color:#666;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.06);border-radius:14px;padding:16px 18px;line-height:1.9}

    .paper .jp{font-size:14px;line-height:2.05;color:rgba(74,74,74,.92);margin-top:16px;border-top:1px solid rgba(0,0,0,.06);padding-top:16px}

  <div class="wrap">

    <h1>インドのデリー新聞で掲載されました（1回目）</h1>
    <div class="meta">2026</div>

    <div class="gallery" aria-label="記事の写真ギャラリー">
      <div class="g-shell" data-gallery>
        <div class="g-track">
          <figure class="g-slide fit-contain">
            <img src="./lp-assets/news-src-03.png?v=20260501" alt="デリー新聞掲載（1回目）の紙面">
            <figcaption class="g-cap">掲載紙面（全体）</figcaption>
          </figure>
          <figure class="g-slide fit-contain">
            <img src="./lp-assets/news-03.png?v=20260501" alt="デリー新聞掲載（1回目）のサムネイル">
            <figcaption class="g-cap">紙面（別カット）</figcaption>
          </figure>
        </div>
        <button class="g-btn prev" type="button" aria-label="前の写真へ">←</button>
        <button class="g-btn next" type="button" aria-label="次の写真へ">→</button>
      </div>
      <div class="g-dots" aria-hidden="true">
        <span class="g-dot is-on"></span><span class="g-dot"></span>
      </div>
    </div>

    <p>越（エツ）インドプロジェクトの活動が、現地メディア（デリー新聞）で取り上げられました。</p>
    <div class="note">紙面は「活動の証拠」として残しつつ、できるだけ読みやすい形で内容も追記していきます。</div>

    <section class="paper" aria-label="新聞記事の原文と日本語訳">
      <h2>英語記事（原文）</h2>
      <div class="sub">※紙面画像の内容を、読みやすい文章として掲載します（準備中）。</div>
      <div class="en">
        <p>Coming soon.</p>
      </div>

      <div class="jp" aria-label="日本語訳">
        <h2>日本語訳</h2>
        <div class="sub">※直訳ではなく、活動の想いが伝わる自然な日本語で整えます（準備中）。</div>
        <p>準備中です。</p>
      </div>
    </section>
  </div>

  <script>
    (function(){
      const shell = document.querySelector('[data-gallery]');
      if(!shell) return;
      const track = shell.querySelector('.g-track');
      const slides = Array.from(shell.querySelectorAll('.g-slide'));
      const dots = Array.from(document.querySelectorAll('.g-dot'));
      const btnPrev = shell.querySelector('.g-btn.prev');
      const btnNext = shell.querySelector('.g-btn.next');

      function indexFromScroll(){
        const w = track.clientWidth || 1;
        return Math.round(track.scrollLeft / w);
      }
      function setDot(i){
        dots.forEach((d,idx)=>d.classList.toggle('is-on', idx===i));
      }
      function go(i){
        const w = track.clientWidth || 1;
        const clamped = Math.max(0, Math.min(slides.length-1, i));
        track.scrollTo({left: w*clamped, behavior: 'smooth'});
        setDot(clamped);
      }
      btnPrev && btnPrev.addEventListener('click', ()=>go(indexFromScroll()-1));
      btnNext && btnNext.addEventListener('click', ()=>go(indexFromScroll()+1));
      track.addEventListener('scroll', ()=>setDot(indexFromScroll()), {passive:true});
    })();
  </script>
