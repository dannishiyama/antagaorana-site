<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>新規登録｜教育者のサロン 灯｜あんたがおらな</title>
<meta name="description" content="教育者のサロン「灯（TOMOSHIBI）」への新規登録ページです。">
<link rel="canonical" href="https://antagaorana.com/salon/tomoshibi/register/">
<link rel="icon" type="image/png" href="/lp-assets/logo-hero.png?v=20260501a">
<link rel="apple-touch-icon" href="/lp-assets/logo-hero.png?v=20260501a">
<style>
:root{color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1E3A2F;
  --green-dk:#132620;
  --green-lt:#3E5A4C;
  --cream:#F6F2E9;
  --paper:#FFFDF8;
  --ink:#2B2926;
  --mid:#6E685F;
  --faint:#9A9388;
  --terra:#B4552F;
  --gold:#C0A05C;
  --line:#DCD5C5;
  --line-soft:#EAE4D6;
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","HiraMinProN-W3","游明朝",serif;
  --sans:"Yu Gothic","YuGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
body{min-height:100vh;background:var(--green-dk);color:#fff;font-family:var(--sans);font-size:15px;line-height:1.9;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit}
input{font-family:inherit;font-size:14px}

.top{padding:20px 8%}
.top a{color:rgba(255,255,255,.7);font-size:12.5px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
.top a:hover{color:#fff}
.top a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 24px 60px}
.card{width:100%;max-width:420px;text-align:center;opacity:0;transform:translateY(12px)}
.card.is-ready{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease}

.mark{font-family:var(--serif);font-size:22px;letter-spacing:.14em;margin-bottom:6px}
.romaji{font-family:var(--serif);font-size:11px;letter-spacing:.28em;color:var(--gold);margin-bottom:14px}
.sub{font-size:12.5px;color:rgba(255,255,255,.6);margin-bottom:40px;line-height:1.9}

.field{text-align:left;margin-bottom:20px}
.field-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.field label{display:block;font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.62)}
.field input{width:100%;min-height:44px;padding:12px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.3);color:#fff;outline:none;transition:border-color .15s ease,background-color .15s ease}
.field input::placeholder{color:rgba(255,255,255,.3)}
.field input:hover{border-color:rgba(255,255,255,.45)}
.field input:focus-visible{border-color:var(--gold);background:rgba(255,255,255,.1);outline:2px solid var(--gold);outline-offset:1px}
.field select{width:100%;min-height:44px;padding:12px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.3);color:#fff;outline:none;font-family:inherit;font-size:14px}
.field select option{color:#2B2926;background:#FFFDF8}
.field select:focus-visible{border-color:var(--gold);outline:2px solid var(--gold);outline-offset:1px}
.hint{font-size:11.5px;color:rgba(255,255,255,.45);margin-top:6px;text-align:left}
.toggle-pw{background:none;border:0;color:rgba(255,255,255,.55);font-size:11.5px;letter-spacing:.04em;cursor:pointer;text-decoration:underline;padding:0;min-height:24px;font-family:var(--sans)}
.toggle-pw:hover{color:#fff}
.toggle-pw:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.agree{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:12.5px;color:rgba(255,255,255,.75);line-height:1.8;margin-bottom:24px;cursor:pointer}
.agree input{width:16px;height:16px;margin-top:3px;accent-color:var(--gold);flex:none}
.agree a{color:#fff;text-decoration:underline}

.go{width:100%;min-height:48px;padding:14px;background:var(--terra);border:1px solid var(--terra);color:#fff;font-size:14px;letter-spacing:.14em;cursor:pointer;font-family:var(--sans);transition:background-color .15s ease,border-color .15s ease}
.go:hover{background:#9E4726;border-color:#9E4726}
.go:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.go[disabled]{opacity:.65;cursor:progress}
.err{font-size:12.5px;color:#EDB9A6;margin-top:14px;min-height:20px;opacity:0}
.err.show{opacity:1}

.already{margin-top:40px;padding-top:26px;border-top:1px solid rgba(255,255,255,.2);font-size:13px;color:rgba(255,255,255,.62)}
.already a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:1px}

.mock-note{margin-top:44px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14);font-size:11.5px;color:rgba(255,255,255,.4);line-height:1.9;text-align:left}

footer{padding:26px 24px 34px;text-align:center;font-size:11.5px;color:rgba(255,255,255,.4);line-height:2.2}
footer a{color:rgba(255,255,255,.55);text-decoration:none;margin:0 10px}
footer a:hover{color:rgba(255,255,255,.8)}

@media(max-width:600px){ .stage{padding:10px 22px 40px} }

@media(prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .card{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>

<div class="top">
  <a href="/salon/">← 灯 紹介ページへ</a>
</div>

<div class="stage">
  <div class="card" id="card">
    <div class="mark">教育者のサロン 灯</div>
    <div class="romaji">TOMOSHIBI</div>
    <p class="sub">新規参加のお申し込み<br>内容を確認のうえ、運営より折り返しご連絡します。</p>

    <form id="f" novalidate>
      <div class="field">
        <label for="fullname">氏名</label>
        <input id="fullname" name="fullname" type="text" autocomplete="name" placeholder="例：佐藤 一郎" maxlength="60">
        <div class="hint">本名をご入力ください</div>
      </div>
      <div class="field">
        <label for="fullnamekana">ふりがな</label>
        <input id="fullnamekana" name="fullnamekana" type="text" autocomplete="off" placeholder="例：さとう いちろう" maxlength="60">
        <div class="hint">ひらがなでご入力ください</div>
      </div>
      <div class="field">
        <label for="nickname">表示名</label>
        <input id="nickname" name="nickname" type="text" autocomplete="nickname" placeholder="例：さとう先生" maxlength="30">
        <div class="hint">サイト内で表示される名前です</div>
      </div>
      <div class="field">
        <label for="prefecture">お住まいの都道府県（任意）</label>
        <select id="prefecture" name="prefecture"><option value="">選択しない</option></select>
        <div class="hint">メンバー一覧に表示されます。あとから「設定」で変更・非公開にできます</div>
      </div>
      <div class="field">
        <label for="facility">運営されている場の種類（任意）</label>
        <input id="facility" name="facility" type="text" autocomplete="off" placeholder="例：学習塾・フリースクール併設" maxlength="30">
        <div class="hint">教室名・学校名ではなく、場の種類だけをご入力ください</div>
      </div>
      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="you@school.example.com">
        <div class="hint">ログインIDとして使用します</div>
      </div>
      <div class="field">
        <div class="field-head">
          <label for="password">パスワード</label>
          <button type="button" class="toggle-pw" data-target="password" aria-pressed="false">表示</button>
        </div>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="••••••••">
        <div class="hint">8文字以上でご設定ください</div>
      </div>
      <div class="field">
        <div class="field-head">
          <label for="password2">パスワード（確認）</label>
          <button type="button" class="toggle-pw" data-target="password2" aria-pressed="false">表示</button>
        </div>
        <input id="password2" name="password2" type="password" autocomplete="new-password" placeholder="••••••••">
      </div>
      <div class="field">
        <label for="reason">教育者のサロン 灯に参加したい理由</label>
        <textarea id="reason" name="reason" rows="4" maxlength="600" style="width:100%;padding:12px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.3);color:#fff;outline:none;font-family:inherit;font-size:14px;resize:vertical" placeholder="現在の教育現場でのお立場や、参加を希望される理由をお聞かせください"></textarea>
      </div>
      <label class="agree">
        <input type="checkbox" id="terms">
        <span><a href="/privacy-policy.html" target="_blank" rel="noopener">プライバシーポリシー</a>と<a href="/commercial-transactions.html" target="_blank" rel="noopener">特定商取引法に基づく表記</a>を確認し、内容に同意します。</span>
      </label>
      <button class="go" type="submit" id="go">申し込む</button>
      <p class="err" id="err" role="alert" aria-live="polite"></p>
    </form>
    <p class="err" id="okmsg" role="status" aria-live="polite" style="color:#cfe0c8"></p>

    <div class="already">
      すでにアカウントをお持ちの方は<br>
      <a href="/salon/tomoshibi/login/">こちらからログイン →</a>
    </div>

    
  </div>
</div>

<footer>
  <a href="/privacy-policy.html" target="_blank" rel="noopener">プライバシーポリシー</a>・<a href="/commercial-transactions.html" target="_blank" rel="noopener">特定商取引法に基づく表記</a>・<a href="mailto:info@antagaorana.com">お問い合わせ</a><br>
  © 株式会社あんたがおらな
</footer>

<script>
// サーバー側API（api/community-auth.js?action=register）に登録する。この時点でパスワードが
// 実際の認証パスワードとして保存される。承認後はこのメールアドレス・パスワードでログインできる。
var PREFS = '北海道,青森県,岩手県,宮城県,秋田県,山形県,福島県,茨城県,栃木県,群馬県,埼玉県,千葉県,東京都,神奈川県,新潟県,富山県,石川県,福井県,山梨県,長野県,岐阜県,静岡県,愛知県,三重県,滋賀県,京都府,大阪府,兵庫県,奈良県,和歌山県,鳥取県,島根県,岡山県,広島県,山口県,徳島県,香川県,愛媛県,高知県,福岡県,佐賀県,長崎県,熊本県,大分県,宮崎県,鹿児島県,沖縄県'.split(',');
(function(){ var sel = document.getElementById('prefecture'); PREFS.forEach(function(p){ var o = document.createElement('option'); o.value = p; o.textContent = p; sel.appendChild(o); }); })();
var KANA_RE = /^[぀-ゟ゠-ヿー\s　]+$/;
(function(){
  var form = document.getElementById('f');
  var err = document.getElementById('err');
  var okmsg = document.getElementById('okmsg');
  var go = document.getElementById('go');
  var GO_LABEL = go.textContent;

  document.querySelectorAll('.toggle-pw').forEach(function(btn){
    btn.addEventListener('click', function(){
      var input = document.getElementById(btn.dataset.target);
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.setAttribute('aria-pressed', String(!showing));
      btn.textContent = showing ? '表示' : '非表示';
    });
  });

  function showError(msg){ okmsg.textContent = ''; err.textContent = msg; err.classList.add('show'); }
  function reset(){ go.disabled = false; go.textContent = GO_LABEL; }
  window.addEventListener('pageshow', reset);

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var fullname = (document.getElementById('fullname').value || '').trim();
    var kana = (document.getElementById('fullnamekana').value || '').trim();
    var nickname = (document.getElementById('nickname').value || '').trim();
    var email = (document.getElementById('email').value || '').trim();
    var pw = document.getElementById('password').value || '';
    var pw2 = document.getElementById('password2').value || '';
    var reason = (document.getElementById('reason').value || '').trim();
    var terms = document.getElementById('terms').checked;

    if(!fullname){ showError('氏名をご入力ください。'); return; }
    if(!kana){ showError('ふりがなをご入力ください。'); return; }
    if(!KANA_RE.test(kana)){ showError('ふりがなはひらがな（またはカタカナ）でご入力ください。'); return; }
    if(!nickname){ showError('表示名をご入力ください。'); return; }
    if(!email){ showError('メールアドレスをご入力ください。'); return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showError('メールアドレスの形式をご確認ください。'); return; }
    if(!pw){ showError('パスワードをご入力ください。'); return; }
    if(pw.length < 8){ showError('パスワードは8文字以上でご設定ください。'); return; }
    if(pw !== pw2){ showError('パスワードが一致しません。'); return; }
    if(!reason){ showError('参加したい理由をご入力ください。'); return; }
    if(!terms){ showError('プライバシーポリシー等への同意が必要です。'); return; }

    err.textContent = ''; err.classList.remove('show');
    go.disabled = true; go.textContent = '送信しています…';

    fetch('/api/community-auth?action=register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        community: 'tomoshibi', fullName: fullname, fullNameKana: kana, displayName: nickname,
        email: email, password: pw, password2: pw2, reason: reason, termsAccepted: terms,
        prefecture: document.getElementById('prefecture').value, facilityLabel: (document.getElementById('facility').value || '').trim(),
        source: new URLSearchParams(location.search).get('cta') || '',
      }),
    }).then(function(r){ return r.json().then(function(data){ return { status: r.status, data: data }; }); })
      .then(function(res){
        if(res.status !== 200){ showError(res.data.error || '送信に失敗しました。'); reset(); return; }
        form.hidden = true;
        okmsg.textContent = 'お申し込みありがとうございます。内容を確認のうえ、審査結果をメールでお送りします。承認され次第、ご登録のメールアドレスとパスワードでログインできます。';
        okmsg.classList.add('show');
      })
      .catch(function(){ showError('通信に失敗しました。時間をおいて再度お試しください。'); reset(); });
  });
})();
</script>

<script type="module">
(async () => {
  try {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const { animate } = await import('/lp-assets/vendor/motion.js');
    document.getElementById('card').classList.add('is-ready');
    const err = document.getElementById('err');
    new MutationObserver(() => {
      if (err.classList.contains('show')) animate(err, { opacity: [0, 1] }, { duration: 0.25, easing: 'ease-out' });
    }).observe(err, { attributes: true, attributeFilter: ['class'] });
  } catch (e) {
    document.getElementById('card').classList.add('is-ready');
    console.warn('[motion] animations skipped:', e);
  }
})();
</script>

</body>
</html>
